<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veille tech — archives</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <div class="mx-auto max-w-3xl px-4 py-10">
    <header class="mb-10">
      <p class="text-xs font-semibold uppercase tracking-widest text-blue-600">Veille tech</p>
      <h1 class="mt-1 text-3xl font-bold tracking-tight text-slate-900">Archives</h1>
      <p class="mt-3 text-slate-600">Sélection quotidienne de liens tech, générée automatiquement par un workflow n8n + Gemini.</p>
    </header>

    <ul id="digests" class="space-y-4">
      <li id="empty" class="rounded-xl border border-dashed border-slate-300 bg-white p-6 text-center text-slate-500">
        Aucun digest publié pour le moment.
      </li>
    </ul>

    <footer class="mt-16 border-t border-slate-200 pt-4 text-sm text-slate-500">
      Généré par n8n + Gemini — <a href="https://github.com/Polluux/n8n-watch-dummy" class="text-blue-600 hover:text-blue-800">code source</a>
    </footer>
  </div>

  <script>
    // digests.json is a pure index: ["YYYY-MM-DD", ...]. Everything else (count,
    // intro) lives in each day's payload — no data duplicated in the manifest.
    // Subtitles are fetched from the most recent payloads only (DETAIL_LIMIT).
    const DETAIL_LIMIT = 30;

    fetch('digests.json')
      .then(r => r.ok ? r.json() : [])
      .then(async dates => {
        if (!Array.isArray(dates) || dates.length === 0) return;
        dates = dates.filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)).sort().reverse();
        if (dates.length === 0) return;

        const details = new Map();
        await Promise.all(dates.slice(0, DETAIL_LIMIT).map(d =>
          fetch('digests/' + d + '.json')
            .then(r => r.ok ? r.json() : null)
            .then(p => { if (p) details.set(d, p); })
            .catch(() => {})
        ));

        const ul = document.getElementById('digests');
        ul.replaceChildren();
        dates.forEach((d, i) => {
          const li = document.createElement('li');
          // The whole card is one link: the <a> carries the card styling and
          // contains the date, badge and subtitle.
          const a = document.createElement('a');
          a.href = 'digest.html?d=' + encodeURIComponent(d);
          a.className = i === 0
            ? 'relative block rounded-xl border border-blue-400 bg-blue-50 p-4 shadow-sm transition hover:shadow-md hover:border-blue-500'
            : 'relative block rounded-xl border border-slate-200 bg-white p-4 shadow-sm transition hover:shadow-md hover:border-slate-300';
          if (i === 0) {
            const badge = document.createElement('span');
            badge.className = 'absolute right-4 top-4 rounded-full bg-blue-600 px-2.5 py-0.5 text-xs font-medium text-white';
            badge.textContent = 'dernier';
            a.appendChild(badge);
          }
          const date = document.createElement('span');
          date.className = 'block font-semibold text-slate-900';
          date.textContent = d;
          a.appendChild(date);
          const p = details.get(d);
          if (p) {
            const meta = document.createElement('span');
            meta.className = 'mt-1 block text-sm text-slate-600';
            meta.textContent = (p.count != null ? p.count + ' liens — ' : '') + (p.intro || '');
            a.appendChild(meta);
          }
          li.appendChild(a);
          ul.appendChild(li);
        });
      })
      .catch(() => {});
  </script>
</body>
</html>
